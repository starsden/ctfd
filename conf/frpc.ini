[common]
token = 261208
server_addr = frps
server_port = 7000
# Admin API — через него whale регистрирует и удаляет пробросы портов.
# Адрес 0.0.0.0: к frpc обращается контейнер ctfd через сеть frp_connect.
admin_addr = 0.0.0.0
admin_port = 7400

# Секции прокси вида [direct_<challenge>_<user>] дописывает плагин ctfd-whale
# через PUT /api/config. Имена сервисов (frps/frpc) резолвятся docker-DNS.

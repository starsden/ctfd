# /etc/dnsmasq.d/ctf.conf
# Конфигурация легковесного DHCP и DNS сервера для локальной CTF сети

# Сетевой интерфейс адаптера 2 (Внутренняя сеть 'ctf-net', смотрящий на участников)
interface=enp0s8
bind-interfaces

# Диапазон выдачи DHCP адресов участникам и время аренды (12 часов)
dhcp-range=192.168.100.50,192.168.100.200,255.255.255.0,12h

# Шлюз по умолчанию: передаем адрес сервера Debian (192.168.100.1)
dhcp-option=3,192.168.100.1

# DNS-сервер: передаем адрес сервера Debian (192.168.100.1)
dhcp-option=6,192.168.100.1

# Локальный домен
domain=local
expand-hosts

# Локальные имена для соревнований (участники открывают http://ctf.local)
address=/ctf.local/192.168.100.1
address=/ctfd.local/192.168.100.1
address=/flag.box/192.168.100.1

# Не использовать внешние DNS из /etc/resolv.conf
no-resolv

# Логирование DHCP транзакций (выдача IP адресов участникам)
log-dhcp
log-queries
log-facility=/var/log/dnsmasq.log

# /etc/dnsmasq.d/mvsosh-lab.conf
# ---- Слушаем только лабовый интерфейс ----
interface=eth0
bind-interfaces
listen-address=192.168.100.1

# ---- DHCP ----
# Диапазон для клиентов (Kali и будущие игроки)
dhcp-range=192.168.100.100,192.168.100.200,255.255.255.0,12h
# Шлюз и DNS для клиентов
dhcp-option=option:router,192.168.100.1
dhcp-option=option:dns-server,192.168.100.1

# Статическая аренда для Kali (при необходимости)
# dhcp-host=08:00:27:xx:xx:xx,192.168.100.135

# ---- DNS ----
# Локальная зона, апстримов нет (хост без интернета)
local=/mvsosh.local/
domain=mvsosh.local
no-resolv
no-poll

# Доменные имена соревнований (mvsosh.local) и совместимость (ctf.local)
address=/mvsosh.local/192.168.100.1
address=/ctf.local/192.168.100.1
# Wildcard: любые прочие запросы клиентов -> 192.168.100.1
address=/#/192.168.100.1


volumes:
  db_data:

networks:
  internal:
    driver: bridge
    internal: true
  frp_connect:
    driver: bridge
    ipam:
      config:
        - subnet: 172.1.0.0/16
  frp_containers:
    name: ctfd-compose_frp_containers
    external: true

services:
  ctfd:
    container_name: ctfd
    image: ctfd-whale-local
    user: root
    restart: always
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    ports:
      - "80:8000"
      - "8000:8000"
    volumes:
      - ./uploads:/var/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SECRET_KEY: 5f345fbaa424e6a22b51addf7f27430927879ae2
      DATABASE_URL: mysql+pymysql://root:ctfd@db/ctfd
      REDIS_URL: redis://cache:6379
      WORKERS: 4
    networks:
      - internal
      - frp_connect

  db:
    container_name: db
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ctfd
      MYSQL_DATABASE: ctfd
      MYSQL_USER: ctfd
      MYSQL_PASSWORD: ctfd
    volumes:
      - db_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  cache:
    container_name: cache
    image: redis:7
    restart: always
    networks: [internal]

  frps:
    container_name: frps
    image: local-frp
    command: ["frps", "-c", "/conf/frps.ini"]
    restart: always
    volumes:
      - ./conf/frps.ini:/conf/frps.ini:ro
    ports:
      - "21000-22000:21000-22000"
    networks:
      - frp_connect

  frpc:
    container_name: frpc
    image: local-frp
    command: ["frpc", "-c", "/conf/frpc.ini"]
    restart: always
    volumes:
      - ./conf/frpc.ini:/conf/frpc.ini
    networks:
      - frp_connect
      - frp_containers
